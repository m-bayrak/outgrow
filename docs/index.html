<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Vertical motion pieces made in code: black ground, white linework, one orange soul." />
    <title>Outgrow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="site.css?v=2" />
  </head>
  <body>
    <main class="project">
      <section class="stage">
        <video
          id="player"
          class="player"
          autoplay
          muted
          loop
          playsinline
          controls
          preload="metadata"
        ></video>
        <img id="still" class="player still" alt="" hidden />
      </section>

      <section class="story">
        <header class="intro">
          <h1 id="title">Outgrow</h1>
          <p id="statement" class="statement"></p>
        </header>

        <nav class="lineage" aria-label="Versions">
          <div id="tree" class="tree"></div>
          <div class="detail">
            <h2 id="detail-title"></h2>
            <p id="summary" class="summary"></p>
            <a id="source" class="source" href="https://github.com/m-bayrak/outgrow"></a>
          </div>
        </nav>

        <footer class="links">
          <a href="https://github.com/m-bayrak/outgrow">Source on GitHub</a>
          <a href="https://github.com/m-bayrak/outgrow/blob/main/STYLE.md">Style</a>
        </footer>
      </section>
    </main>

    <noscript>
      <p class="noscript">This page needs JavaScript to list the versions. The videos are in <a href="https://github.com/m-bayrak/outgrow/tree/main/docs/media">docs/media</a>.</p>
    </noscript>

    <script src="site.js?v=2" type="module"></script>
  </body>
</html>
