<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Outgrow</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
      }
      video {
        display: block;
        width: min(100vw, 56.25svh);
        height: min(177.78vw, 100svh);
        background: #000;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <video controls autoplay loop playsinline preload="metadata" aria-label="Outgrow animation">
      <source src="outgrow.mp4" type="video/mp4" />
      Your browser does not support video playback.
    </video>
  </body>
</html>
